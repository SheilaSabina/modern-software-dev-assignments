<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modern Software Dev Starter</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <style>
      :root { --primary-blue: #2563eb; --hover-blue: #1d4ed8; --danger-red: #ef4444; }
      body { font-family: sans-serif; background-color: #f8fafc; color: #1e293b; padding: 20px; }
      main { max-width: 800px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; shadow: 0 4px 6px rgba(0,0,0,0.1); }
      h1 { color: var(--primary-blue); border-bottom: 2px solid var(--primary-blue); padding-bottom: 10px; }
      section { margin-bottom: 2rem; padding: 1rem; border: 1px solid #e2e8f0; border-radius: 6px; }
      button { background-color: var(--primary-blue); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
      button:hover { background-color: var(--hover-blue); }
      .btn-delete { background-color: transparent; color: var(--danger-red); border: 1px solid var(--danger-red); margin-left: 10px; font-size: 0.8rem; }
      .btn-delete:hover { background-color: var(--danger-red); color: white; }
      li { margin-bottom: 10px; padding: 8px; background: #f1f5f9; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
    </style>
  </head>
  <body>
    <main>
      <h1>Modern Software Dev Starter</h1>

      <section>
        <h2>Notes</h2>
        <form id="note-form">
          <input id="note-title" placeholder="Title" required />
          <input id="note-content" placeholder="Content" required />
          <button type="submit">Add</button>
        </form>
        <ul id="notes"></ul>
      </section>

      <section>
        <h2>Action Items</h2>
        <form id="action-form">
          <input id="action-desc" placeholder="Description" required />
          <button type="submit">Add</button>
        </form>
        <ul id="actions"></ul>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
